<title>My Program</title>
<style>
:root {
  --bg:#0d0d0d; --bg2:#161616; --bg3:#1e1e1e;
  --border:rgba(255,255,255,0.09); --border2:rgba(255,255,255,0.15);
  --text:#f0f0f0; --text2:#888; --text3:#555;
  --radius:12px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;overflow-x:hidden}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
input{font-family:inherit;color:var(--text)}
a{color:inherit;text-decoration:none}
.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* HOME */
.home-header{padding:22px 14px 12px}
.home-title{font-size:24px;font-weight:700;letter-spacing:-0.03em}
.home-sub{font-size:13px;color:var(--text2);margin-top:3px}
.bw-card{margin:0 14px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;display:flex;align-items:center;gap:10px}
.bw-label{font-size:14px;color:var(--text2);flex:1}
.bw-inp{width:72px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;text-align:center;font-size:16px}
.bw-unit{font-size:13px;color:var(--text3)}
.day-list{padding:0 14px;display:flex;flex-direction:column;gap:8px}
.day-btn{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;width:100%}
.day-btn-left{display:flex;align-items:center;gap:12px;min-width:0}
.day-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.day-name{font-size:16px;font-weight:700}
.day-sub-text{font-size:12px;color:var(--text2);margin-top:2px}
.ring-wrap{position:relative;flex-shrink:0}
.ring-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.schedule-card{margin:0 14px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px}
.schedule-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.schedule-row{display:flex;gap:5px}
.schedule-day{flex:1;text-align:center;font-size:10px;padding:6px 1px;border-radius:6px;border:1px solid var(--border)}
.tools-row{padding:18px 14px 26px;display:flex;gap:8px;justify-content:center}
.tool-btn{font-size:12px;color:var(--text2);border:1px solid var(--border);border-radius:20px;padding:8px 14px;background:var(--bg2)}
.tool-btn.danger{color:#f43f5e;border-color:rgba(244,63,94,.3)}

/* WORKOUT HEADER */
.wk-header{background:var(--bg);border-bottom:1px solid var(--border);padding:11px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.back-btn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border2);flex-shrink:0;font-size:20px}
.wk-title-block{flex:1;min-width:0}
.wk-title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-sub-text{font-size:11px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct-pill{padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--border2);white-space:nowrap}
.wk-body{flex:1;overflow-y:auto;padding-bottom:96px}

/* SECTION */
.section{padding:12px 14px 4px}
.sec-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}

/* CHECKLIST */
.chk-item{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:7px;min-height:50px;cursor:pointer;user-select:none}
.chk-item.done{opacity:.4}
.chk-box{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.chk-box.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.chk-text{font-size:14px;line-height:1.35}
.chk-item.done .chk-text{text-decoration:line-through}

/* EXERCISE CARD */
.ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.ex-card.skipped{opacity:.35}
.ex-top{padding:12px 13px 9px}
.ex-name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px}
.ex-name{font-size:15px;font-weight:700;line-height:1.3;flex:1;min-width:0}
.ex-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.ex-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex-target{font-size:12px;color:var(--text2)}
.pr-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(251,191,36,0.18);color:#fbbf24}
.yt-btn{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:20px;border:1px solid var(--border2);font-size:12px;color:var(--text2);background:var(--bg3)}
.chk-watch{min-width:56px;min-height:48px;justify-content:center;font-size:15px;flex-shrink:0;margin-left:8px;border-radius:var(--radius-sm)}
.skip-btn{font-size:11px;color:var(--text3);padding:6px 10px;border-radius:20px;border:1px solid var(--border)}
.skip-btn.on{color:#f43f5e;border-color:rgba(244,63,94,.4)}
.all-btn{font-size:11px;font-weight:700;padding:6px 10px;border-radius:20px;border:1px solid var(--border2)}

.target-banner{margin:0 13px 10px;padding:9px 12px;background:var(--bg3);border-radius:var(--radius-sm);border-left:3px solid currentColor;display:flex;align-items:center;justify-content:space-between;gap:8px}
.target-val{font-size:20px;font-weight:700}
.target-note{font-size:11px;color:var(--text3);margin-top:2px}

/* SET ROWS — whole row taps to log; chips edit */
.set-row-wrap{padding:0 13px;border-bottom:1px solid var(--border)}
.set-row-inner{display:flex;align-items:center;gap:8px;padding:9px 0;min-height:56px;cursor:pointer;user-select:none}
.set-row-inner.faded{opacity:.4}
.set-num{font-size:12px;color:var(--text3);width:16px;text-align:center;flex-shrink:0}
.set-main{flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.val-chip{display:inline-flex;align-items:baseline;gap:4px;padding:7px 11px;border-radius:var(--radius-sm);border:1px dashed var(--border2);background:var(--bg3);min-width:58px;justify-content:center}
.set-val{font-size:19px;font-weight:700}
.set-unit{font-size:11px;color:var(--text3)}
.set-tick{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.set-tick.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.set-hint{font-size:10px;color:var(--text3);padding:0 13px 8px}

/* PROG NOTE */
.prog-note{margin:8px 13px;font-size:12px;padding:8px 11px;border-radius:var(--radius-sm);line-height:1.45}
.prog-note.bump{border-left:3px solid #a3e635;color:#a3e635;background:rgba(163,230,53,.07)}
.prog-note.hold{border-left:3px solid #fbbf24;color:#fbbf24;background:rgba(251,191,36,.07)}
.prog-note.drop{border-left:3px solid #f43f5e;color:#f43f5e;background:rgba(244,63,94,.07)}

/* CHART */
.chart-toggle-btn{width:100%;padding:11px 13px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);font-size:13px;color:var(--text2)}
.chart-area{padding:12px 13px;border-top:1px solid var(--border)}
.chart-tabs{display:flex;gap:6px;margin-bottom:10px}
.ctab{padding:6px 13px;border-radius:20px;font-size:12px;border:1px solid var(--border2);color:var(--text2)}
.ctab.on{background:var(--text);color:var(--bg);border-color:transparent}

/* VOL */
.vol-strip{padding:6px 14px 2px}
.vol-chip{font-size:12px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);padding:4px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}

/* SAVE BUTTON */
.save-section{padding:14px 14px 6px}
.save-btn{width:100%;padding:16px;border-radius:var(--radius);font-size:16px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
.save-btn:active{opacity:.75}
.save-confirm{text-align:center;font-size:13px;color:var(--text2);padding:6px 0 12px}

/* TIMER BAR */
.timer-bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:60}
.timer-left{min-width:0}
.timer-time{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer-time.go{color:#a3e635}
.timer-time.flash{animation:tflash .5s 4}
@keyframes tflash{50%{color:#a3e635}}
.timer-lbl{font-size:9px;color:var(--text3);margin-top:1px}
.t-btns{display:flex;gap:7px;flex-shrink:0}
.tbtn{padding:10px 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;border:1px solid var(--border2);min-width:54px}
.tbtn.pri{background:var(--text);color:var(--bg);border-color:transparent}

/* PIN LOCK */
.pindot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border2);transition:background .12s}
.pindot.on{background:var(--text);border-color:var(--text)}
.pinkey{width:72px;height:72px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);font-size:26px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:center}
.pinkey:active{background:var(--bg3)}
.pinkey.blank{border:none;background:none}
#pinLock.shake{animation:pinshake .4s}
@keyframes pinshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* HOME GYM */
.hg-toggle{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid rgba(56,189,248,.4);color:#38bdf8}
.hg-toggle.on{background:#38bdf8;color:var(--bg)}
/* PACK BTN */
.pack-tab-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border2);font-size:22px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--bg2)}
.pack-tab-btn.ready::after{content:'';position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#a3e635;border:2px solid var(--bg)}

/* STEPPER SHEET */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none}

.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--border2);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));z-index:100;transform:translateY(105%);transition:transform .18s ease-out}

.step-btn{width:64px;height:64px;border-radius:16px;border:1px solid var(--border2);background:var(--bg3);font-size:28px;font-weight:700;flex-shrink:0}

.sheet-done{width:100%;padding:15px;border-radius:var(--radius);font-size:16px;font-weight:700;background:var(--text);color:var(--bg)}
</style>

<script>
// ── YOUTUBE LINKS ──────────────────────────────────────────────────────────
// Plain https search links — open reliably everywhere. On a phone with the
// YouTube app installed, the system usually offers to open the app anyway.
function yt(q){
  return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' short');
}
function ytS(q){
  return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' form');
}
function ytHref(raw){
  return raw||'#';
}

// ── TIMED SET ──────────────────────────────────────────────────────────────
// Fires the rest timer for the exercise duration, then auto-ticks the set
function startTimedSet(exId,si,durSec){
  const ex=findEx(exId);
  const sets=getOrInit(currentDay,exId,ex.hasW,ex.target);
  if(sets[si].logged) return; // already done — just start rest
  // Override timer duration for this countdown
  const prevDur=timerDur;
  timerDur=durSec;
  timerLeft=durSec;
  timerEnd=Date.now()+durSec*1000;
  timerRunning=true;
  // When done: tick set and restore rest timer
  const origDone=timerDone;
  timerDone=function(){
    beep(); if(navigator.vibrate) navigator.vibrate([250,120,250,120,400]);
    const d=document.getElementById('timerDisp');
    if(d){d.classList.add('flash');setTimeout(()=>d.classList.remove('flash'),2200);}
    timerDur=prevDur; timerLeft=prevDur;
    timerDone=origDone;
    sets[si].logged=true;
    saveAll(); renderWorkout();
  };
  runTicker(); updateTimerUI();
}

// ── TIMED CHECKLIST ITEM ───────────────────────────────────────────────────
// For warm-up/finisher items that have a timerSec (e.g. dead hangs)
function startTimedCheck(idx,durSec,label){
  const prevDur=timerDur;
  timerDur=durSec; timerLeft=durSec;
  timerEnd=Date.now()+durSec*1000;
  timerRunning=true;
  const d=document.getElementById('timerDisp');
  const origDone=timerDone;
  timerDone=function(){
    beep(); if(navigator.vibrate) navigator.vibrate([250,120,250,120,400]);
    if(d){d.classList.add('flash');setTimeout(()=>d.classList.remove('flash'),2200);}
    timerDur=prevDur; timerLeft=prevDur;
    timerDone=origDone;
    // auto-tick the checklist item
    if(!checks[currentDay]) checks[currentDay]={};
    checks[currentDay][idx]=true;
    saveAll(); renderWorkout();
  };
  runTicker(); updateTimerUI();
}


function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='screenPack') renderPack();
  if(id==='screenHome') renderHome();
}

// ── PACKING CHECKLIST ──────────────────────────────────────────────────────
const PACK_ITEMS=[
  {id:'shirt',      label:'Shirt'},
  {id:'trousers',   label:'Trousers'},
  {id:'belt',       label:'Belt'},
  {id:'socks',      label:'Socks'},
  {id:'boxers',     label:'Boxers'},
  {id:'washbag',    label:'Washbag'},
  {id:'towel',      label:'Towel'},
  {id:'sliders',    label:'Sliders (shower)'},
  {id:'padlock',    label:'Padlock'},
  {id:'water',      label:'Water bottle'},
  {id:'headphones', label:'Headphones'},
  {id:'phone',      label:'Phone charged'},
];

function loadPack(){
  return loadL('pack')||{checks:{},packed:false,packedDate:null};
}
function savePack(p){saveL('pack',p);}

function renderPack(){
  const p=loadPack();
  const today=todayStr();
  // Auto-clear if packed date was before today (new day = fresh list)
  if(p.packed && p.packedDate && p.packedDate<today){
    p.checks={}; p.packed=false; p.packedDate=null; savePack(p);
  }
  const done=PACK_ITEMS.filter(i=>p.checks[i.id]).length;
  const total=PACK_ITEMS.length;
  const pct=Math.round((done/total)*100);
  document.getElementById('packPct').textContent=pct+'%';
  document.getElementById('packSub').textContent=p.packed?'✓ Packed for tomorrow':'Pack for tomorrow · '+done+'/'+total;
  const badge=document.getElementById('packBadge');
  if(badge) badge.classList.toggle('ready',p.packed);

  const btn=document.getElementById('packDoneBtn');
  const msg=document.getElementById('packMsg');
  if(p.packed){
    btn.textContent='✓ Packed!'; btn.style.background='var(--bg3)'; btn.style.color='var(--text2)';
    if(msg) msg.textContent='Reset clears automatically tomorrow morning';
  } else {
    btn.textContent='✓ All packed — see you tomorrow'; btn.style.background='#a3e635'; btn.style.color='#0d0d0d';
    if(msg) msg.textContent='';
  }

  const body=document.getElementById('packBody');
  body.innerHTML=PACK_ITEMS.map(item=>{
    const on=!!p.checks[item.id];
    return '<div class="chk-item'+(on?' done':'')+'" onclick="togglePackItem(\''+item.id+'\')" style="margin-bottom:10px;min-height:58px">'+
      '<div class="chk-box'+(on?' on':'')+'">✓</div>'+
      '<span class="chk-text" style="font-size:16px">'+esc(item.label)+'</span>'+
    '</div>';
  }).join('');
}

function togglePackItem(id){
  const p=loadPack(); if(p.packed) return;
  p.checks[id]=!p.checks[id];
  savePack(p); renderPack();
}
function packDone(){
  const p=loadPack(); if(p.packed) return;
  p.packed=true; p.packedDate=todayStr();
  savePack(p); renderPack();
}

// ── BACKUP / RESTORE ───────────────────────────────────────────────────────
function exportData(){
  const out={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith(PREFIX)) out[k]=localStorage.getItem(k);
  }
  const blob=new Blob([JSON.stringify({app:'workout-tracker',exported:new Date().toISOString(),data:out},null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='workout-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
document.getElementById('importFile').addEventListener('change',function(){
  const f=this.files[0]; this.value=''; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      const data=obj&&obj.data; if(!data||typeof data!=='object') throw 0;
      const keys=Object.keys(data).filter(k=>k.startsWith(PREFIX));
      if(!keys.length) throw 0;
      if(!confirm('Restore backup? This replaces current data ('+keys.length+' entries).')) return;
      keys.forEach(k=>localStorage.setItem(k,data[k]));
      location.reload();
    }catch(e){alert("That file doesn't look like a workout backup.");}
  };
  r.readAsText(f);
});
function resetData(){
  if(!confirm('Erase ALL workout data and history?')) return;
  if(!confirm('Last chance — this cannot be undone. Erase everything?')) return;
  for(let i=localStorage.length-1;i>=0;i--){
    const k=localStorage.key(i);
    if(k&&k.startsWith(PREFIX)) localStorage.removeItem(k);
  }
  location.reload();
}

// Get current stage object for an exercise
function getStage(exId){
  const cfg=EX_CONFIG[exId]; if(!cfg||!cfg.stageProg) return null;
  const stages=STAGE_PROGS[cfg.stageProg]; if(!stages) return null;
  const p=getP(exId);
  const idx=Math.min(p.stage||0, stages.length-1);
  return {stage:stages[idx], idx, total:stages.length, isLast:idx>=stages.length-1};
}

// Advance to next stage — permanently stored
function advanceStage(exId){
  const stages=STAGE_PROGS[exId]; if(!stages) return;
  const p=getP(exId);
  const cur=p.stage||0;
  if(cur<stages.length-1){p.stage=cur+1;}
  saveAll(); renderWorkout();
}


// "4×8–10" → {sets:4, lo:8, hi:10, unit:'reps'} · "3×30m" → unit 'm' · "3×20–30sec" → unit 'sec'
function parseTarget(t){
  const m=(t||'').match(/(\d+)\s*[x×]\s*(\d+)(?:\s*[–-]\s*(\d+))?\s*([a-z]*)/i);
  if(!m) return {sets:3,lo:8,hi:8,unit:'reps'};
  const lo=+m[2], hi=m[3]?+m[3]:lo;
  let unit='reps';
  if(m[4]){const u=m[4].toLowerCase(); if(u.indexOf('sec')===0)unit='sec'; else if(u==='m')unit='m';}
  return {sets:+m[1],lo,hi,unit};
}

// ── PROGRESSION ────────────────────────────────────────────────────────────
function getP(exId){
  if(!progression[exId]){const c=EX_CONFIG[exId]||{start:0};progression[exId]={w:c.start,fail:0,done:false};}
  return progression[exId];
}
function getSuggestedW(exId){return getP(exId).w;}
function findEx(exId){for(const d of DAYS){const e=d.exercises.find(x=>x.id===exId);if(e)return e;}return null;}

// Applied ONCE per session, when the workout is saved (or auto-archived next day).
function applyProgression(exId,sets){
  const cfg=EX_CONFIG[exId]||{}; 
  const p=getP(exId); if(p.done) return;
  const ex=findEx(exId); if(!ex) return;
  const {sets:ts,lo}=parseTarget(ex.target);
  const logged=sets.filter(s=>s.logged);
  if(logged.length<ts) return;
  p.done=true;
  // Bodyweight rep progression (pull-ups): no weight, bump reps in target
  if(!ex.hasW && cfg.repProg){
    const allHit=logged.every(s=>num(s.reps)>=lo);
    if(allHit){p.fail=0;p.repTarget=(p.repTarget||lo)+1;}
    else{p.fail=(p.fail||0)+1;}
    return;
  }
  if(!cfg.inc) return;
  const hi=parseTarget(ex.target).hi;
  const allTop=logged.every(s=>num(s.reps)>=hi);
  const missed=logged.some(s=>num(s.reps)<lo);
  if(allTop){p.fail=0;p.w=round25(p.w+cfg.inc);}
  else if(missed){p.fail++;if(p.fail>=2){p.w=Math.max(cfg.start||0,round25(p.w*0.9));p.fail=0;}}
}

// Live preview — never mutates state.
function getNote(exId,sets){
  const cfg=EX_CONFIG[exId]||{};
  const p=getP(exId);
  const ex=findEx(exId); if(!ex) return null;
  const {sets:ts,lo,hi}=parseTarget(ex.target);
  const logged=sets.filter(s=>s.logged);
  if(logged.length<ts) return null;
  if(p.done){
    if(!ex.hasW&&cfg.repProg) return {type:'bump',msg:'Saved — aim for '+(p.repTarget||lo+1)+' reps next session'};
    return {type:'bump',msg:'Saved — next session loaded at '+p.w+' kg'};
  }
  // Bodyweight rep progression
  if(!ex.hasW&&cfg.repProg){
    const allHit=logged.every(s=>num(s.reps)>=lo);
    if(allHit) return {type:'bump',msg:'All sets hit — aim for '+(lo+1)+' reps next session'};
    return {type:'hold',msg:'Hit '+lo+' clean reps every set to progress'};
  }
  if(!cfg.inc) return null;
  const allTop=logged.every(s=>num(s.reps)>=hi);
  const missed=logged.some(s=>num(s.reps)<lo);
  if(allTop) return {type:'bump',msg:'All sets hit — +'+cfg.inc+' kg next session'};
  if(missed&&p.fail>=1) return {type:'drop',msg:'Missed reps again — weight drops ~10% next session'};
  if(missed) return {type:'hold',msg:'Missed reps — holding weight next session'};
  return {type:'hold',msg:'Good — hold weight, aim for '+hi+' next session'};
}

// ── TIME-BASED CHECKLIST PROGRESSION (e.g. dead hang seconds) ─────────────
function getTimeProgSec(progId){
  const cfg=EX_CONFIG[progId]||{}; if(!cfg.timeProg) return null;
  const p=getP(progId);
  return p.timeSec||cfg.startSec||15;
}
function applyTimeProg(progId){
  const cfg=EX_CONFIG[progId]||{}; if(!cfg.timeProg) return;
  const p=getP(progId); if(p.timeDone) return;
  p.timeDone=true;
  const cur=p.timeSec||cfg.startSec||15;
  const max=cfg.maxSec||30;
  if(cur<max) p.timeSec=Math.min(max,cur+(cfg.incSec||5));
  p.fail=0;
}
function resetTimeDoneForDay(dayId){
  // called on daily rollover — unlocks time progression for next session
  const day=DAYS.find(d=>d.id===dayId); if(!day) return;
  day.finisher.forEach(item=>{
    if(item.prog){const p=getP(item.prog); if(p) p.timeDone=false;}
  });
}


function archiveDay(dayId,dateStr){
  const day=DAYS.find(d=>d.id===dayId); if(!day) return 0;
  const s=sessions[dayId]||{}; let count=0;
  day.exercises.forEach(ex=>{
    const sets=s[ex.id]||[];
    const logged=sets.filter(st=>st.logged);
    if(logged.length) applyProgression(ex.id,sets);
    logged.forEach(st=>{
      if(st.arch) return;                       // already in history
      if(st.weight||st.reps){
        if(!history[ex.id]) history[ex.id]=[];
        history[ex.id].push({date:dateStr,weight:num(st.weight),reps:num(st.reps)});
        st.arch=true;
        count++;
      }
    });
  });
  return count;
}

// ── SESSION RESET ──────────────────────────────────────────────────────────
function checkReset(dayId){
  const today=todayStr();
  const lastKey='last_'+dayId; const last=loadL(lastKey);
  if(last&&last!==today){
    archiveDay(dayId,last);
    sessions[dayId]={}; checks[dayId]={};
    const day=DAYS.find(d=>d.id===dayId);
    day.exercises.forEach(ex=>{if(progression[ex.id]) progression[ex.id].done=false;});
    resetTimeDoneForDay(dayId);
    saveAll();
  }
  saveL(lastKey,today);
}

// ── SESSION HELPERS ────────────────────────────────────────────────────────
function getOrInit(dayId,exId,hasW,target,setsOverride){
  if(!sessions[dayId]) sessions[dayId]={};
  if(!sessions[dayId][exId]){
    const {sets,hi}=parseTarget(target||'3×8');
    const sw=hasW?getSuggestedW(exId):0;
    const cfg=EX_CONFIG[exId]||{};
    const repTarget=(!hasW&&cfg.repProg)?((getP(exId).repTarget)||hi):hi;
    const numSets=setsOverride||sets;
    sessions[dayId][exId]=Array.from({length:numSets},()=>({
      weight:hasW&&sw?String(sw):'',
      reps:String(repTarget),
      logged:false
    }));
  } else if(setsOverride&&sessions[dayId][exId].length!==setsOverride){
    // Stage changed — resize session sets preserving logged ones
    const cur=sessions[dayId][exId];
    const hw=hasW?getSuggestedW(exId):0;
    sessions[dayId][exId]=Array.from({length:setsOverride},(_,i)=>
      cur[i]||{weight:hasW&&hw?String(hw):'',reps:'',logged:false}
    );
  }
  return sessions[dayId][exId];
}

function isAutoSkip(exId){
  if(!homeGym) return false;
  return !!(EX_CONFIG[exId]&&EX_CONFIG[exId].skip_home);
}

function dayPct(dayId){
  const day=DAYS.find(d=>d.id===dayId);
  const c=checks[dayId]||{}; const s=sessions[dayId]||{}; const sk2=skipped[dayId]||{};
  const tc=day.warmup.length+day.finisher.length;
  const dc=Object.values(c).filter(Boolean).length;
  let ts=0,ds=0;
  day.exercises.forEach(ex=>{
    if(sk2[ex.id]||isAutoSkip(ex.id)) return;
    (s[ex.id]||[{}]).forEach(st=>{ts++;if(st.logged)ds++;});
  });
  const t=tc+ts,d=dc+ds; return t>0?Math.round((d/t)*100):0;
}

function volToday(dayId){
  const s=sessions[dayId]||{}; let v=0;
  Object.values(s).forEach(sets=>sets.forEach(st=>{
    if(st.logged&&st.weight&&st.reps) v+=num(st.weight)*num(st.reps);
  }));
  return Math.round(v);
}

// PR = beats every entry in history (current set isn't in history yet)
function isPR(exId,w,r){
  const h=history[exId]; if(!h||!h.length) return false;
  const best=Math.max.apply(null,h.map(x=>x.weight*x.reps));
  return best>0&&(w*r)>best;
}

// ── RENDER WORKOUT ─────────────────────────────────────────────────────────
function renderWorkout(){
  const day=DAYS.find(d=>d.id===currentDay); if(!day) return;
  const c=checks[currentDay]||{};
  const sk2=skipped[currentDay]||{};
  const pct=dayPct(currentDay);
  const vol=volToday(currentDay);
  const accent=day.color;

  document.getElementById('wkPct').textContent=pct+'%';
  document.getElementById('wkPct').style.color=accent;

  let h='';

  // Home gym toggle
  h+='<div style="padding:12px 14px 6px;display:flex;align-items:center;justify-content:space-between">'+
    '<div style="font-size:13px;color:var(--text2)">🏠 Home gym</div>'+
    '<button class="hg-toggle'+(homeGym?' on':'')+'" onclick="toggleHG()">'+(homeGym?'ON':'OFF')+'</button>'+

  if(vol>0) h+='<div class="vol-strip"><span class="vol-chip">⚡ '+vol.toLocaleString()+' kg volume</span></div>';

     '<div class="set-hint" style="padding:0 0 8px">Tap a row when you hit the target — tap the numbers only if you didn\u2019t.</div>';

    const cfg=EX_CONFIG[ex.id]||{start:0,inc:0};
    const autoSkip=isAutoSkip(ex.id);
    const isSkipped=sk2[ex.id]||autoSkip;
    const stageInfo2=getStage(ex.id);
    const effectiveSets=stageInfo2?stageInfo2.stage.sets:null;
    const sets=getOrInit(currentDay,ex.id,ex.hasW,ex.target,effectiveSets);
    const tgt=parseTarget(ex.target);
    const hist=history[ex.id]||[];
    const hasChart=hist.length>1;
    const showChart=openCharts[ex.id];
    const tab=chartTabs[ex.id]||'volume';
    const prHit=sets.some(s=>s.logged&&s.weight&&s.reps&&isPR(ex.id,num(s.weight),num(s.reps)));
    const sw=ex.hasW?getSuggestedW(ex.id):null;
    const note=getNote(ex.id,sets);
    const nextW=ex.hasW&&cfg.inc?round25((sw||0)+cfg.inc):null;
    const allDone=sets.length>0&&sets.every(s=>s.logged);

    h+='<div class="ex-card'+(isSkipped?' skipped':'')+'">'+
      '<div class="ex-top">'+
        '<div class="ex-name-row">'+
          '<div class="ex-name">'+esc(ex.name)+'</div>'+
          '<div class="ex-actions">'+
            '<a href="'+ytHref(EX_VIDEO[ex.id]||yt(ex.name))+'" target="_blank" rel="noopener" class="yt-btn">▶</a>'+
            (!isSkipped&&!allDone?'<button class="all-btn" style="color:'+accent+';border-color:'+accent+'" onclick="logAll(\''+ex.id+'\')">✓ all</button>':'')+
            '<button class="skip-btn'+(isSkipped?' on':'')+'" onclick="toggleSkip(\''+ex.id+'\')" '+(autoSkip?'disabled':'')+'>'+
              (isSkipped?'skipped':'skip')+
            '</button>'+
          '</div>'+
        '</div>'+
        '<div class="ex-meta">'+
          '<span class="ex-target" style="color:'+accent+'">'+esc(ex.target)+'</span>'+
          (prHit?'<span class="pr-tag">🏆 PR</span>':'')+
        '</div>'+
        (cfg.homeAlt&&homeGym&&autoSkip?'<div style="font-size:12px;color:#38bdf8;margin-top:6px;line-height:1.4">🏠 Sub: '+esc(cfg.homeAlt)+'</div>':'')+
        (cfg.homeAlt&&homeGym&&!autoSkip?'<div style="font-size:12px;color:#38bdf8;margin-top:6px">🏠 Note: '+esc(cfg.homeAlt)+'</div>':'')+
      '</div>';

    if(!isSkipped){
      // Stage progression panel
      const stageInfo=getStage(ex.id);
      if(stageInfo){
        const {stage,idx,total,isLast}=stageInfo;
        const stageSets=stage.sets;
        const stageReps=stage.reps;
        const stageTimer=stage.timerSec||null;
        // Override session sets/reps to match current stage
        if(!sessions[currentDay]) sessions[currentDay]={};
        const curSets=sessions[currentDay][ex.id];
        if(!curSets||curSets.length!==stageSets){
          sessions[currentDay][ex.id]=Array.from({length:stageSets},(_,i)=>

            '<div style="font-size:10px;color:var(--text3)">'+( idx+1)+'/'+total+'</div>'+
          '</div>'+
          '<div style="font-size:12px;color:var(--text2);line-height:1.55">'+esc(stage.inst)+'</div>'+
          (!isLast?
            '<button onclick="advanceStage(\''+ex.id+'\')" style="margin-top:10px;width:100%;padding:10px;border-radius:var(--radius-sm);background:'+accent+';color:#0d0d0d;font-size:13px;font-weight:700;border:none;cursor:pointer">✓ Stage complete — unlock next</button>':
            '<div style="margin-top:8px;font-size:11px;color:'+accent+'">🏆 Final stage — keep building reps</div>'
          )+
        '</div>';
      }

      if(ex.hasW&&sw!==null&&sw>0){
        const restSec=cfg.rest||120;
        const restLbl=restSec>=60?(restSec/60)+'m':''+restSec+'s';
        h+='<div class="target-banner" style="color:'+accent+'">'+
          '<div>'+
            '<div style="font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em">Target weight</div>'+
            '<div class="target-val">'+sw+' kg</div>'+
            '<div class="target-note">'+(nextW?'Hit all reps → '+nextW+' kg next session':'')+'</div>'+
          '</div>'+
          '<div style="text-align:right">'+
            '<div style="font-size:22px">🎯</div>'+
            '<div style="font-size:10px;color:var(--text3);margin-top:2px">⏱ '+restLbl+' rest</div>'+
          '</div>'+
        '</div>';
      }

      if(note) h+='<div class="prog-note '+note.type+'">'+esc(note.msg)+'</div>';

      sets.forEach((set,si)=>{
        const stageInfo=getStage(ex.id);
        const stageDur=stageInfo&&stageInfo.stage.timerSec||null;
        const isTimed=!!(ex.timerSec||stageDur);
        const dur=stageDur||ex.timerSec||0;
        h+='<div class="set-row-wrap">'+
          '<div class="set-row-inner'+(set.logged?' faded':'')+'" onclick="'+(isTimed?'':'tickSet(\''+ex.id+'\','+si+')')+'">'+
            '<div class="set-num">'+(si+1)+'</div>'+
            '<div class="set-main">'+
              (ex.hasW?
                '<span class="val-chip" onclick="event.stopPropagation();openEdit(\''+ex.id+'\','+si+',\'weight\')">'+
                  '<span class="set-val" style="color:'+accent+'">'+esc(set.weight||'—')+'</span>'+
                  '<span class="set-unit">kg</span>'+
                '</span>':'')+
              (isTimed?
                '<button class="val-chip" style="cursor:pointer;border-color:'+accent+'" onclick="event.stopPropagation();startTimedSet(\''+ex.id+'\','+si+','+dur+')">'+
                  '<span class="set-val" style="color:'+accent+'">▶</span>'+
                  '<span class="set-unit">'+dur+'s</span>'+
                '</button>':
                '<span class="val-chip" onclick="event.stopPropagation();openEdit(\''+ex.id+'\','+si+',\'reps\')">'+
                  '<span class="set-val">'+esc(set.reps||'—')+'</span>'+
                  '<span class="set-unit">'+tgt.unit+'</span>'+
                '</span>')+
            '</div>'+
            '<button class="set-tick'+(set.logged?' on':'')+'" onclick="event.stopPropagation();'+(isTimed?'startTimedSet(\''+ex.id+'\','+si+','+dur+')':'tickSet(\''+ex.id+'\','+si+')')+'">'+(set.logged?'✓':'○')+'</button>'+
          '</div>'+
        '</div>';
      });

      if(hasChart){
        h+='<button class="chart-toggle-btn" onclick="toggleChart(\''+ex.id+'\')">'+
          '📈 '+(showChart?'hide':'show')+' progress <span>'+(showChart?'↑':'↓')+'</span>'+
        '</button>';
        if(showChart){
          h+='<div class="chart-area">'+
            '<div class="chart-tabs">'+
              '<button class="ctab'+(tab==='volume'?' on':'')+'" onclick="setTab(\''+ex.id+'\',\'volume\')">volume</button>'+
              '<button class="ctab'+(tab==='weight'?' on':'')+'" onclick="setTab(\''+ex.id+'\',\'weight\')">weight</button>'+
              '<button class="ctab'+(tab==='reps'?' on':'')+'" onclick="setTab(\''+ex.id+'\',\'reps\')">reps</button>'+

  });
  h+='</div>';

  h+='<div class="section"><div class="sec-label">Mobility finisher</div>';
  day.finisher.forEach((item,i)=>{
    const idx=day.warmup.length+i;
    h+=chkRow(item,idx,c[idx]);
  });
  h+='</div>';

  // Save
  h+='<div class="save-section">'+
    '<button class="save-btn" onclick="saveWorkout()" style="background:'+accent+';color:#0d0d0d">💾 Save workout</button>'+
    '<div class="save-confirm" id="saveConfirm"></div>'+
  '</div>';

  const body=document.getElementById('wkBody');
  const st=body.scrollTop;          // keep scroll position across re-renders

}

function chkRow(item,idx,done){
  const label=item.t||item; const raw=item.v||null;
  const url=raw?ytHref(raw):null;
  const notes=item.notes||null;
  // Time progression label
  let progLabel='';
  let timedSec=item.timerSec||null;
  if(item.prog){
    const sec=getTimeProgSec(item.prog);
    const p=getP(item.prog);
    const cfg=EX_CONFIG[item.prog]||{};
    const max=cfg.maxSec||30;
    const next=Math.min(max,(p.timeSec||cfg.startSec||15)+(cfg.incSec||5));
    progLabel='<span style="font-size:11px;color:var(--text3);margin-left:6px">'+sec+'s'+(sec<max?' → '+next+'s':' ✓ max')+'</span>';
    if(timedSec==='prog') timedSec=sec;
  }
  const notesHtml=notes?
    '<div style="margin-top:8px;padding:8px 10px;background:var(--bg3);border-radius:var(--radius-sm);border-left:2px solid var(--border2)">'+
      notes.map(n=>'<div style="font-size:12px;color:var(--text2);padding:2px 0;line-height:1.4">'+esc(n)+'</div>').join('')+
    '</div>':'';
  // Timed items get a start button instead of ticking directly
  const startBtn=timedSec?
    '<button class="tbtn pri" style="font-size:12px;padding:8px 12px;flex-shrink:0;margin-left:8px;align-self:flex-start" '+
      'onclick="event.stopPropagation();startTimedCheck('+idx+','+timedSec+',\''+esc(label)+'\')">'+timedSec+'s ▶</button>':'';
  return '<div class="chk-item'+(done?' done':'')+'" onclick="toggleCheck('+idx+')" style="justify-content:space-between;align-items:flex-start">'+
    '<div style="flex:1;min-width:0">'+
      '<div style="display:flex;align-items:center;gap:11px">'+
        '<div class="chk-box'+(done?' on':'')+'" style="flex-shrink:0;margin-top:1px">✓</div>'+
        '<span class="chk-text">'+esc(label)+'</span>'+
        progLabel+
      '</div>'+
      (notesHtml?'<div style="padding-left:35px">'+notesHtml+'</div>':'')+
    '</div>'+
    (timedSec?startBtn:'')+
    (!timedSec&&url?'<a href="'+url+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" ontouchend="event.stopPropagation()" class="yt-btn chk-watch" style="margin-left:8px;flex-shrink:0;align-self:flex-start;margin-top:1px">▶</a>':'')+
    (timedSec&&url?'<a href="'+url+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" ontouchend="event.stopPropagation()" class="yt-btn chk-watch" style="margin-left:6px;flex-shrink:0;align-self:flex-start;margin-top:1px">▶</a>':'')+
  '</div>';
}

// ── ACTIONS ────────────────────────────────────────────────────────────────
function toggleHG(){homeGym=!homeGym;saveAll();renderWorkout();}

function toggleCheck(idx){
  if(!checks[currentDay]) checks[currentDay]={};
  checks[currentDay][idx]=!checks[currentDay][idx];
  saveAll(); renderWorkout();
}

function toggleSkip(exId){
  if(!skipped[currentDay]) skipped[currentDay]={};
  skipped[currentDay][exId]=!skipped[currentDay][exId];
  saveAll(); renderWorkout();
}

function tickSet(exId,si){
  const ex=findEx(exId);
  const sets=getOrInit(currentDay,exId,ex.hasW,ex.target);
  const set=sets[si];
  if(set.arch) return;
  set.logged=!set.logged;
  if(set.logged){
    const cfg=EX_CONFIG[exId]||{};
    startRest(cfg.rest||timerDur);
  }
  saveAll(); renderWorkout();
}

function logAll(exId){
  const ex=findEx(exId);
  const sets=getOrInit(currentDay,exId,ex.hasW,ex.target);
  let any=false;
  sets.forEach(s=>{if(!s.arch&&!s.logged){s.logged=true;any=true;}});
  if(any){
    const cfg=EX_CONFIG[exId]||{};
    startRest(cfg.rest||timerDur);
  }
  saveAll(); renderWorkout();
}

function saveWorkout(){
  const count=archiveDay(currentDay,todayStr());
  // Apply time-based finisher progressions for ticked items
  const day=DAYS.find(d=>d.id===currentDay);
  const c=checks[currentDay]||{};
  day.finisher.forEach((item,i)=>{
    const idx=day.warmup.length+i;
    if(item.prog&&c[idx]) applyTimeProg(item.prog);
  });
  saveL('last_'+currentDay,todayStr());
  saveAll(); renderWorkout();
  const el=document.getElementById('saveConfirm');
  if(el) el.textContent=count>0?'✓ Saved — '+count+' sets logged to history':'✓ Saved — nothing new to log';
}

function toggleChart(exId){openCharts[exId]=!openCharts[exId];renderWorkout();}
function setTab(exId,tab){chartTabs[exId]=tab;renderWorkout();}

// ── STEPPER SHEET (replaces prompt() editing) ──────────────────────────────
function openEdit(exId,si,field){
  const ex=findEx(exId);
  const sets=getOrInit(currentDay,exId,ex.hasW,ex.target);
  if(sets[si].arch) return;
  editCtx={exId,si,field};
  const cfg=EX_CONFIG[exId]||{};
  const tgt=parseTarget(ex.target);
  document.getElementById('sheetTitle').textContent=ex.name;
  document.getElementById('sheetSub').textContent='Set '+(si+1)+' — '+(field==='weight'?'weight (kg)':tgt.unit==='reps'?'reps':tgt.unit);
  const inp=document.getElementById('stepVal');
  inp.value=sets[si][field]||0;
  document.getElementById('sheetBack').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function stepInc(){
  if(!editCtx) return 1;
  if(editCtx.field!=='weight') return 1;
  const cfg=EX_CONFIG[editCtx.exId]||{};
  return cfg.inc||2.5;
}
function stepVal(dir){
  const inp=document.getElementById('stepVal');
  let v=num(inp.value)+dir*stepInc();
  v=Math.max(0,round25(v));
  inp.value=v;
  commitEdit();
}
function commitEdit(){
  if(!editCtx) return;
  const {exId,si,field}=editCtx;
  const ex=findEx(exId);
  const sets=getOrInit(currentDay,exId,ex.hasW,ex.target);
  const v=Math.max(0,num(document.getElementById('stepVal').value));
  sets[si][field]=v?String(v):'';
  saveAll();
}
document.getElementById('stepVal').addEventListener('input',commitEdit);
function closeSheet(){
  commitEdit();
  editCtx=null;
  document.getElementById('sheetBack').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  renderWorkout();
}

// ── CHART (tiny inline SVG — works offline, no CDN) ────────────────────────
function chartSVG(exId,color){
  const all=history[exId]||[];
  const h=all.slice(-20);
  if(h.length<2) return '';
  const tab=chartTabs[exId]||'volume';
  const vals=h.map(x=>tab==='weight'?x.weight:tab==='reps'?x.reps:Math.round(x.weight*x.reps));
  const W=320,H=110,PL=8,PR2=8,PT=12,PB=18;
  const mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  const rg=(mx-mn)||1;
  const px=i=>PL+i*(W-PL-PR2)/(vals.length-1);
  const py=v=>PT+(1-(v-mn)/rg)*(H-PT-PB);
  const pts=vals.map((v,i)=>px(i).toFixed(1)+','+py(v).toFixed(1));
  const lastI=vals.length-1;
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="'+esc(exId)+' progress">'+
    '<polygon points="'+px(0).toFixed(1)+','+(H-PB)+' '+pts.join(' ')+' '+px(lastI).toFixed(1)+','+(H-PB)+'" fill="'+color+'" opacity="0.12"/>'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    vals.map((v,i)=>'<circle cx="'+px(i).toFixed(1)+'" cy="'+py(v).toFixed(1)+'" r="3" fill="'+color+'"/>').join('')+
    '<text x="'+px(lastI).toFixed(1)+'" y="'+Math.max(9,py(vals[lastI])-7).toFixed(1)+'" text-anchor="end" font-size="10" fill="'+color+'" font-weight="700">'+vals[lastI]+'</text>'+
    '<text x="'+PL+'" y="'+(H-5)+'" font-size="9" fill="#555">'+esc(h[0].date.slice(5))+'</text>'+
    '<text x="'+(W-PR2)+'" y="'+(H-5)+'" text-anchor="end" font-size="9" fill="#555">'+esc(h[h.length-1].date.slice(5))+'</text>'+
  '</svg>';
}

// ── REST TIMER (timestamp-based: survives screen lock, never drifts) ───────
const TIMER_PRESETS=[60,90,120,180];
let timerDur=120, timerLeft=120, timerEnd=0, timerRunning=false, timerIv=null;

function fmtT(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60);}
function remaining(){return timerRunning?(timerEnd-Date.now())/1000:timerLeft;}

function startRest(dur){
  dur=dur||timerDur;
  timerEnd=Date.now()+dur*1000;
  timerLeft=dur;
  timerRunning=true;
  runTicker();
  updateTimerUI();
}
function toggleTimer(){
  if(timerRunning){
    timerLeft=Math.max(0,remaining());
    timerRunning=false;
    clearInterval(timerIv);
  }else{
    if(timerLeft<=0) timerLeft=timerDur;
    timerEnd=Date.now()+timerLeft*1000;
    timerRunning=true;
    runTicker();
  }
  updateTimerUI();
}
function resetTimer(){
  timerRunning=false; clearInterval(timerIv);
  timerLeft=timerDur;
  updateTimerUI();
}
function timerAux(){
  if(timerRunning){                   // running: +30s
    timerEnd+=30000;
  }else{                              // idle: cycle rest length
    const i=TIMER_PRESETS.indexOf(timerDur);
    timerDur=TIMER_PRESETS[(i+1)%TIMER_PRESETS.length]||120;
    timerLeft=timerDur;
    saveAll();
  }
  updateTimerUI();
}
function runTicker(){
  clearInterval(timerIv);
  timerIv=setInterval(()=>{
    if(!timerRunning) return;
    if(remaining()<=0){
      timerRunning=false; clearInterval(timerIv);
      timerLeft=timerDur;
      timerDone();
    }
    updateTimerUI();
  },250);
}
function timerDone(){
  if(navigator.vibrate) navigator.vibrate([250,120,250,120,400]);
  beep();
  const d=document.getElementById('timerDisp');
  if(d){d.classList.add('flash');setTimeout(()=>d.classList.remove('flash'),2200);}
}
let audioCtx=null;
function beep(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach((t,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value=i===2?1320:880; o.type='sine';
      const s=audioCtx.currentTime+t;
      g.gain.setValueAtTime(0.001,s);
      g.gain.exponentialRampToValueAtTime(0.4,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,s+0.18);
      o.start(s); o.stop(s+0.2);
    });
  }catch(e){}
}
function updateTimerUI(){
  const d=document.getElementById('timerDisp'),b=document.getElementById('timerBtn'),a=document.getElementById('timerAux');
  if(d){d.textContent=fmtT(remaining());d.classList.toggle('go',timerRunning);}
  if(b) b.textContent=timerRunning?'pause':'start';
  if(a) a.textContent=timerRunning?'+30s':fmtT(timerDur);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimerUI();});

// ── PIN LOCK ───────────────────────────────────────────────────────────────
// PIN is stored hashed (not plaintext) in localStorage. First launch sets it.
// This protects data if the hosted link is found — it is NOT bank-grade
// security, just a sensible barrier for a personal training log.
let pinEntry='', pinStage='check', pinFirst='';

function pinHash(s){
  // simple FNV-1a hash — enough to avoid storing the PIN in plain text
  let h=0x811c9dc5;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}
  return (h>>>0).toString(16);
}
function getStoredPin(){return loadL('pinHash');}

function buildPinPad(){
  const pad=document.getElementById('pinPad');
  let h='';
  for(let n=1;n<=9;n++) h+='<button class="pinkey" onclick="pinPress(\''+n+'\')">'+n+'</button>';
  h+='<button class="pinkey blank"></button>';
  h+='<button class="pinkey" onclick="pinPress(\'0\')">0</button>';
  h+='<button class="pinkey" onclick="pinDel()" style="font-size:20px">⌫</button>';
  pad.innerHTML=h;
}
function renderPinDots(){
  document.querySelectorAll('.pindot').forEach((d,i)=>d.classList.toggle('on',i<pinEntry.length));
}
function pinPress(n){
  if(pinEntry.length>=4) return;
  pinEntry+=n;
  renderPinDots();
  if(pinEntry.length===4) setTimeout(pinSubmit,150);
}
function pinDel(){ pinEntry=pinEntry.slice(0,-1); renderPinDots(); }
function pinShake(){
  const el=document.getElementById('pinLock');
  el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400);
}
function pinSubmit(){
  if(pinStage==='check'){
    if(pinHash(pinEntry)===getStoredPin()){ unlockApp(); }
    else { pinShake(); pinEntry=''; renderPinDots(); document.getElementById('pinSub').textContent='Wrong PIN — try again'; }
  } else if(pinStage==='set1'){
    pinFirst=pinEntry; pinEntry=''; renderPinDots();
    pinStage='set2';
    document.getElementById('pinTitle').textContent='Confirm PIN';
    document.getElementById('pinSub').textContent='Enter the same 4 digits again';
  } else if(pinStage==='set2'){
    if(pinEntry===pinFirst){
      saveL('pinHash',pinHash(pinEntry));
      unlockApp();
    } else {
      pinShake(); pinEntry=''; pinFirst=''; renderPinDots();
      pinStage='set1';
      document.getElementById('pinTitle').textContent='Set a PIN';
      document.getElementById('pinSub').textContent="Didn't match — choose 4 digits";
    }
  }
}
function pinForgot(){
  if(!confirm('Reset PIN? This ERASES all workout data and history — there is no other way to recover access.')) return;
  if(!confirm('Are you sure? Everything will be wiped.')) return;
  for(let i=localStorage.length-1;i>=0;i--){
    const k=localStorage.key(i);
    if(k&&k.startsWith(PREFIX)) localStorage.removeItem(k);
  }
  location.reload();
}
function showPinLock(){
  const stored=getStoredPin();
  const lock=document.getElementById('pinLock');
  buildPinPad();
  pinEntry=''; renderPinDots();
  if(stored){
    pinStage='check';
    document.getElementById('pinTitle').textContent='Enter PIN';
    document.getElementById('pinSub').textContent='';
    document.getElementById('pinForgot').style.display='block';
  } else {
    pinStage='set1';
    document.getElementById('pinTitle').textContent='Set a PIN';
    document.getElementById('pinSub').textContent='Choose 4 digits to protect your data';
    document.getElementById('pinForgot').style.display='none';
  }
  lock.style.display='flex';
}
function unlockApp(){
  document.getElementById('pinLock').style.display='none';
  // run the normal init now that we're unlocked
  loadAll();
  DAYS.forEach(d=>checkReset(d.id));
  renderHome();
  updateTimerUI();
}

// ── INIT ───────────────────────────────────────────────────────────────────
document.getElementById('bwInput').addEventListener('change',()=>saveAll());
showPinLock();
</script>
